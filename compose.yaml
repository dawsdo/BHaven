services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: dev-root-password
      MYSQL_ROOT_HOST: "%"
      MYSQL_DATABASE: shelterlink
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-pdev-root-password"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  mysql_data:
