services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: shelter
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-shelter}
      POSTGRES_DB: shelter
    ports:
      - "5432:5432"
    volumes:
      - shelter-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shelter -d shelter"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  shelter-db:
